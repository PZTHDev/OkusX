<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="OkusX banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14102b"/>
      <stop offset="0.55" stop-color="#3d2468"/>
      <stop offset="1" stop-color="#8a3d72"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a47fd3"/>
      <stop offset="1" stop-color="#5fb4ff"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <circle cx="1080" cy="70" r="150" fill="#a47fd3" opacity="0.18"/>
  <circle cx="1210" cy="300" r="120" fill="#5fb4ff" opacity="0.14"/>
  <circle cx="90" cy="330" r="110" fill="#ff7aa8" opacity="0.10"/>

  <!-- stylized glass cards: one library, several accounts -->
  <g transform="translate(790,58)">
    <rect x="0" y="0" width="400" height="244" rx="22" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.35"/>
    <g>
      <circle cx="44" cy="52" r="20" fill="url(#accent)"/>
      <rect x="80" y="38" width="170" height="12" rx="6" fill="#ffffff" opacity="0.75"/>
      <rect x="80" y="58" width="110" height="9" rx="4.5" fill="#ffffff" opacity="0.35"/>
      <rect x="318" y="38" width="56" height="28" rx="14" fill="#ffffff" opacity="0.22"/>
    </g>
    <g>
      <circle cx="44" cy="112" r="20" fill="#ff7aa8" opacity="0.9"/>
      <rect x="80" y="98" width="140" height="12" rx="6" fill="#ffffff" opacity="0.75"/>
      <rect x="80" y="118" width="90" height="9" rx="4.5" fill="#ffffff" opacity="0.35"/>
      <rect x="318" y="98" width="56" height="28" rx="14" fill="#ffffff" opacity="0.22"/>
    </g>
    <g>
      <circle cx="44" cy="172" r="20" fill="#7be0b0" opacity="0.9"/>
      <rect x="80" y="158" width="190" height="12" rx="6" fill="#ffffff" opacity="0.75"/>
      <rect x="80" y="178" width="120" height="9" rx="4.5" fill="#ffffff" opacity="0.35"/>
      <rect x="318" y="158" width="56" height="28" rx="14" fill="#ffffff" opacity="0.22"/>
    </g>
    <rect x="24" y="210" width="352" height="12" rx="6" fill="url(#accent)" opacity="0.85"/>
  </g>

  <!-- text -->
  <text x="80" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="96" font-weight="700" fill="#ffffff">OkusX</text>
  <text x="84" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#ffffff" opacity="0.88">All your Steam accounts. One library.</text>
  <text x="84" y="266" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#ffffff" opacity="0.6">Standalone · Local-first · No forced login</text>

  <rect x="84" y="290" width="118" height="34" rx="17" fill="#ffffff" opacity="0.16" stroke="#ffffff" stroke-opacity="0.4"/>
  <text x="143" y="313" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff">beta 1.0</text>
</svg>
